[package]
name = "mod-chatty"
version = "1.0.3"
edition = "2024"
license = "MIT"
publish = false
description = "Chatty for Sunrise: player heads in chat, timestamps, stacked repeats, chat history kept per server and world, and a symbol picker."
authors = ["Zekrenlight"]

[lib]
name = "mod_chatty"
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
